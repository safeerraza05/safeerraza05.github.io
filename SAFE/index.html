<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAFE</title>

    <!-- Pre-boot deep-link guard: ?open_case=<id> → /SAFE/open/<id> -->
    <script>
      (function () {
        try {
          var scope = location.pathname.indexOf('/SAFE') === 0 ? '/SAFE' : '';
          var url = new URL(location.href);
          var qs  = url.searchParams;
          var cid = qs.get('open_case') || qs.get('case') || qs.get('case_id') || qs.get('cid');
          if (cid && /^\d+$/.test(cid)) {
            var target = scope + '/open/' + cid;
            if (url.pathname !== target) history.replaceState(null, '', target);
          }
        } catch (_) {}
      })();
    </script>

    <!-- Runtime API override (keep your Railway host) -->
    <script>
      window.__SAFE_API_BASE__ = 'https://safe-production-658f.up.railway.app';
    </script>
    <script type="module" crossorigin src="/SAFE/assets/index-CLd1_TMm.js"></script>
    <link rel="stylesheet" crossorigin href="/SAFE/assets/index-Mv-s7Fxv.css">
  </head>
  <body>
    <div id="root"></div>

    <!-- Deterministic hand-off: SW click -> tell SPA to navigate -->
    <script>
      (function () {
        function toOpen(url, caseId) {
          try {
            var scope = location.pathname.indexOf('/SAFE') === 0 ? '/SAFE' : '';
            if (!url && caseId) url = scope + '/open/' + String(caseId);
            if (!url && caseId) url = scope + '/?open_case=' + encodeURIComponent(String(caseId));
            if (!url) return;
            location.replace(url);
          } catch (_) {}
        }
        if ('serviceWorker' in navigator && navigator.serviceWorker) {
          try {
            navigator.serviceWorker.addEventListener('message', function (e) {
              var m = e && e.data || {};
              if (m && m.type === 'SAFE_NOTIF_CLICK') toOpen(m.url, m.case_id);
            });
          } catch (_) {}
        }
      })();
    </script>

    <!-- React app mount (keep last) -->
  </body>
</html>
